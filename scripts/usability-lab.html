<!doctype html><meta charset="utf-8"><title>Local usability QA fixtures</title>
<p>Test-only checkpoints on this localhost origin. No production saves are touched.</p>
<button data-case="loss">Game Over checkpoint</button><button data-case="boss">Gatekeeper Level 5</button><button data-case="promotion">Promotion Level 5</button><button data-case="master">Master Game Over</button>
<button id="lifecycle">Run simulated background lifecycle check</button><output id="check" role="status"></output><iframe id="game" title="Isolated lifecycle test" hidden></iframe>
<script type="module">
import {createRun,submit,advance,nextLevel} from '../dist/engine.js';import {questions} from '../dist/questions.js';import {emptyProfile,captureProgress,saveProfile} from '../dist/storage.js';
for(const button of document.querySelectorAll('button[data-case]'))button.onclick=()=>{const type=button.dataset.case,run=createRun(questions,'QA PLAYER');const target=type==='master'?61:type==='boss'?5:type==='promotion'?6:1;while(run.level<target){for(let i=0;i<10;i++){submit(run,questions,questions.find(q=>q.id===run.queue[run.index].id).answer);advance(run,questions)}if(type==='promotion'&&run.level===5)break;nextLevel(run,questions)}if(['loss','master'].includes(type)){for(let i=0;i<3;i++){submit(run,questions,-1);if(i<2)advance(run,questions)}}const p=emptyProfile();captureProgress(p,run);saveProfile(localStorage,p);location.href='../dist/'};
document.querySelector('#lifecycle').onclick=async()=>{
 const output=document.querySelector('#check'),frame=document.querySelector('#game');const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));const check=(value,message)=>{if(!value)throw Error(message)};
 try{const p=emptyProfile();p.run=createRun(questions);saveProfile(localStorage,p);output.textContent='Running…';frame.hidden=false;frame.src='../dist/';await new Promise(resolve=>frame.onload=resolve);
 const win=frame.contentWindow,doc=frame.contentDocument;doc.querySelector('[data-action=continue]').click();doc.querySelector('[data-action=resume]').click();await wait(250);
 const background=()=>{Object.defineProperty(doc,'hidden',{configurable:true,value:true});doc.dispatchEvent(new Event('visibilitychange'))};const foreground=()=>{Object.defineProperty(doc,'hidden',{configurable:true,value:false});doc.dispatchEvent(new Event('visibilitychange'))};
 background();const time=JSON.parse(localStorage.getItem('lions-gate-arcade-v3')).run.remaining;await wait(1200);check(!!doc.querySelector('.pause-overlay'),'Background question must pause');check(JSON.parse(localStorage.getItem('lions-gate-arcade-v3')).run.remaining===time,'Background time must not consume question time');foreground();check(!!doc.querySelector('.pause-overlay'),'Foreground requires explicit Resume');doc.querySelector('[data-action=resume]').click();
 const r=JSON.parse(localStorage.getItem('lions-gate-arcade-v3')).run,q=questions.find(q=>q.id===r.queue[r.index].id);doc.querySelector(`[data-answer="${q.answer}"]`).click();background();const phase=doc.querySelector('.game-scene').dataset.combat;
 const travel=doc.querySelector('.scene-status>.judah').getAnimations().find(a=>a.animationName==='judah-advance'),travelTime=travel?.currentTime;
 check(!!travel,'Production combat has an approach animation');await wait(1200);check(travel.playState==='paused'&&Math.abs(travel.currentTime-travelTime)<1,'Background freezes the same approach animation clock');
 check(doc.querySelector('.game-scene').dataset.combat===phase,'Background combat must freeze');check(!doc.querySelector('#answer-reveal').open,'Background combat cannot open reveal');foreground();doc.querySelector('[data-action=resume]').click();await wait(1100);check(doc.querySelector('#answer-reveal').open,'Resumed combat must finish');check(JSON.parse(localStorage.getItem('lions-gate-arcade-v3')).run.answers.length===1,'Exactly one answer accepted');
 background();check(!doc.querySelector('#answer-reveal').open,'Background reveal closes under pause overlay');foreground();doc.querySelector('[data-action=resume]').click();check(doc.querySelector('#answer-reveal').open,'Same reveal restores');win.dispatchEvent(new Event('pagehide'));check(!!doc.querySelector('.pause-overlay'),'Pagehide suspends app');check(JSON.parse(localStorage.getItem('lions-gate-arcade-v3')).run.answers.length===1,'Pagehide saves without replaying outcome');output.textContent='PASS: simulated visibility/background/foreground, precise saved question time, frozen combat, one impact/result, restored reveal, pagehide checkpoint.';
 }catch(error){output.textContent='FAIL: '+error.message}
};
</script>
