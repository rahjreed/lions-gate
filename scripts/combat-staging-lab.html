<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../dist/"><title>Local combat staging QA</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="juice.css"><link rel="stylesheet" href="mascot.css"><link rel="stylesheet" href="console.css"><link rel="stylesheet" href="adventure.css"><link rel="stylesheet" href="answer-reveal.css"><link rel="stylesheet" href="combat.css"><link rel="stylesheet" href="mobile-game.css"><link rel="stylesheet" href="celebration.css"><link rel="stylesheet" href="armor.css"><link rel="stylesheet" href="usability.css"><link rel="stylesheet" href="viewport.css">
<style>.qa-controls{padding:10px;display:flex;flex-wrap:wrap;gap:6px}.qa-controls button,.qa-controls select{min-height:44px}#status{display:block;white-space:pre-wrap;font:12px/1.6 monospace;padding:12px}body.gameplay{display:block;height:auto;overflow:auto!important}body.gameplay #app{flex:none;height:auto;min-height:0}.game-scene.qa-reduced *{animation:none!important;translate:none!important}.game-scene.qa-reduced .roman-soldier{animation:none!important}</style></head><body><header>LOCAL COMBAT STAGING QA</header><main id="app"></main><section class="qa-controls" aria-label="QA controls">
<select id="rank" aria-label="Rank"><option value="0">Novice</option><option value="5">Student</option><option value="15">Scholar</option><option value="30">Scribe</option><option value="75">Master with Belt</option></select>
<button id="correct">Correct</button><button id="wrong">Wrong</button><button id="shield">Shield</button><button id="timeout">Timeout</button><button id="boss">Gatekeeper</button><button id="ko">Final strike</button><button id="reduced">Reduced motion</button><button id="pause">Pause</button><button id="resume">Resume</button><button id="audit">Audit all exchanges</button><button id="live">Play live exchange</button><button id="final-game">Open final question in game</button>
<label>Inspect time <input id="time" type="range" min="0" max="1320" step="1" value="0"></label><button data-at="0">Stance</button><button data-at="140">Strike 140ms</button><button data-at="240">Impact 240ms</button><button data-at="540">Recovery 540ms</button><button data-at="920">Home 920ms</button><button data-at="1300">Defeated 1300ms</button>
</section><output id="status" role="status">Ready</output>
<script type="module">
import {CombatDirector,paintCombat,romanSoldier,combatHealth,combatHealthMarkup,updateCombatHealth} from './combat.js';import {judah} from './mascot.js';import {landscape} from './art.js';import {symbolicGate} from './adventure.js';import {createRun,beginLevel,submit,advance} from './engine.js';import {questions} from './questions.js';import {setGameLayout} from './mobile-game.js';
import {emptyProfile,captureProgress,saveProfile} from './storage.js';
const app=document.querySelector('#app'),output=document.querySelector('#status'),slider=document.querySelector('#time');let run,director,current='correct',time=0,id=0,jobs=new Map(),impacts=0,finished=0,hero,home,pausedAt=null,reduced=false;
const rect=e=>{const r=e.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height}};
function setup(type='correct',start=true){current=type;reduced=type==='reduced';director?.cancel();time=0;jobs=new Map();impacts=finished=0;pausedAt=null;document.body.classList.remove('app-paused');run=createRun(questions);run.completed=Number(document.querySelector('#rank').value);run.level=type==='boss'?5:run.completed+1;beginLevel(run,questions);if(type==='ko')for(let i=0;i<9;i++){submit(run,questions,questions.find(q=>q.id===run.queue[run.index].id).answer);advance(run,questions)}const equipment=run.completed>=75?['belt']:[];
app.innerHTML=`${combatHealthMarkup(run)}<div class="game-scene ${type==='boss'?'boss-scene adventure-arena':''} ${reduced?'qa-reduced':''}">${landscape(0)}${type==='boss'?symbolicGate():''}<div class="scene-status"><span>COMBAT QA</span>${judah(run.completed,'ready',false,equipment)}${romanSoldier()}<span class="combat-sparks"></span></div></div>`;setGameLayout(true);hero=app.querySelector('.judah');home={hero:rect(hero),enemy:rect(app.querySelector('.roman-soldier'))};
director=new CombatDirector({now:()=>time,setTimer:(fn,ms)=>{jobs.set(++id,{fn,at:time+ms});return id},clearTimer:id=>jobs.delete(id)});
if(start){const q=questions.find(q=>q.id===run.queue[run.index].id);if(type==='shield')run.shielded=true;submit(run,questions,type==='wrong'||type==='shield'?(q.answer+1)%4:type==='timeout'?-1:q.answer);director.start({correct:run.answers.at(-1).correct,enemyDefeated:combatHealth(run).enemy===0,reducedMotion:reduced,onFrame:frame=>paintCombat(app.querySelector('.game-scene'),frame,run.completed,equipment),onImpact:()=>{impacts++;updateCombatHealth(app,run)},onFinish:()=>finished++})}sync();}
function sync(){for(const animation of app.getAnimations({subtree:true})){animation.pause();const name=animation.animationName;let start=0;if(name==='judah-contact-sequence'||name==='hero-slash-fx')start=140;if(name==='judah-walk-loop')start=540;if(name==='judah-recoil-sequence')start=240;if(name==='roman-defeat')start=540;animation.currentTime=Math.max(0,time-start)}slider.value=time;report()}
function tick(ms){const end=time+ms;while(true){const entry=[...jobs].filter(([,j])=>j.at<=end).sort((a,b)=>a[1].at-b[1].at)[0];if(!entry)break;jobs.delete(entry[0]);time=entry[1].at;entry[1].fn()}time=end;sync()}
function data(){const scene=app.querySelector('.game-scene'),enemy=app.querySelector('.roman-soldier');return {type:current,time,phase:scene.dataset.combat||'idle',heroPose:hero.dataset.pose,heroIdentity:hero===app.querySelector('.judah'),impacts,finished,lives:run.lives,health:combatHealth(run),home,hero:rect(hero),enemy:rect(enemy),heroTravel:getComputedStyle(hero).translate,enemyTravel:getComputedStyle(enemy).translate,footInset:enemy.style.getPropertyValue('--roman-foot'),width:innerWidth,arena:rect(scene),horizontal:document.documentElement.scrollWidth>innerWidth}}
function report(){output.textContent=JSON.stringify(data(),null,2)}
for(const type of ['correct','wrong','shield','timeout','boss','ko','reduced'])document.querySelector('#'+type).onclick=()=>setup(type);
document.querySelector('#final-game').onclick=()=>{setup('ko',false);const profile=emptyProfile();captureProgress(profile,run);saveProfile(localStorage,profile);location.href='../dist/'};
document.querySelector('#live').onclick=()=>{setup(current,false);const q=questions.find(q=>q.id===run.queue[run.index].id);if(current==='shield')run.shielded=true;submit(run,questions,current==='wrong'||current==='shield'?(q.answer+1)%4:current==='timeout'?-1:q.answer);const frames=[],start=performance.now(),equipment=run.completed>=75?['belt']:[];director=new CombatDirector();director.start({correct:run.answers.at(-1).correct,enemyDefeated:combatHealth(run).enemy===0,reducedMotion:reduced,onFrame:f=>{time=Math.round(performance.now()-start);paintCombat(app.querySelector('.game-scene'),f,run.completed,equipment);const animation=hero.getAnimations().find(a=>a.animationName==='judah-advance'||a.animationName==='judah-retreat');frames.push({phase:f.phase,at:f.at,pose:hero.dataset.pose,actorTime:animation?.currentTime,identity:hero===app.querySelector('.judah')});report()},onImpact:()=>{impacts++;updateCombatHealth(app,run)},onFinish:()=>{finished++;output.textContent=JSON.stringify({live:true,...data(),frames},null,2)}})};
function seek(at){setup(current,at>0);if(at>0)tick(at)}
for(const button of document.querySelectorAll('[data-at]'))button.onclick=()=>seek(Number(button.dataset.at));slider.oninput=()=>seek(Number(slider.value));document.querySelector('#rank').onchange=()=>setup(current,false);
document.querySelector('#pause').onclick=()=>{director.pause();pausedAt=time;document.body.classList.add('app-paused');tick(5000);report()};document.querySelector('#resume').onclick=()=>{if(pausedAt===null)return;director.resume();document.body.classList.remove('app-paused');tick(1320);pausedAt=null};
document.querySelector('#audit').onclick=()=>{const records=[];for(const type of ['correct','wrong','shield','timeout','boss','ko','reduced']){setup(type);tick(240);const impact=data();director.pause();const pending=jobs.size;tick(5000);const frozen=impacts===1&&finished===(reduced?1:0)&&jobs.size===pending;director.resume();tick(1320);const end=data();records.push({type,impactOnce:impact.impacts===1&&end.impacts===1,finishedOnce:end.finished===1,identity:end.heroIdentity,home:Math.abs(end.hero.x-end.home.hero.x)<1&&(type==='ko'||Math.abs(end.enemy.x-end.home.enemy.x)<1),expectedLives:end.lives===(['wrong','timeout'].includes(type)?2:3),frozen,horizontal:end.horizontal,finalPhase:end.phase})}output.textContent=JSON.stringify({result:records.every(r=>r.impactOnce&&r.finishedOnce&&r.identity&&r.home&&r.expectedLives&&r.frozen&&!r.horizontal)?'PASS':'FAIL',records},null,2)};
setup('correct',false);
</script></body></html>
