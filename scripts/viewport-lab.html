<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Viewport regression lab</title>
<style>body{margin:0;font:14px Arial}button,label{display:inline-block;min-height:44px;margin:4px}output{display:block;white-space:pre-wrap}iframe{display:block;border:0;width:100vw;height:100dvh}</style>
<button id="audit">Audit all 42 live questions</button><button id="longest">Load longest question</button><button id="gestures">Check synthetic gesture cancellation</button><label><input id="notch" type="checkbox"> Simulate 44px top / 34px bottom safe areas</label><output id="status" role="status">Ready</output><iframe id="frame" title="Production gameplay viewport"></iframe>
<script type="module">
import {createRun,beginLevel} from '../dist/engine.js';import {questions} from '../dist/questions.js';import {emptyProfile,captureProgress,saveProfile} from '../dist/storage.js';import '../dist/viewport.js';
const output=document.querySelector('#status'),frame=document.querySelector('#frame'),notch=document.querySelector('#notch');
const sorted=[...questions].sort((a,b)=>b.q.length+b.options.join('').length-a.q.length-a.options.join('').length);
function checkpoint(q){const run=createRun(questions,'VIEWPORT QA');run.level=61;run.completed=60;beginLevel(run,questions);run.queue=[{id:q.id,order:[0,1,2,3]},...run.queue.filter(e=>e.id!==q.id)].slice(0,10);const p=emptyProfile();captureProgress(p,run);saveProfile(localStorage,p)}
async function show(q){frame.src='about:blank';await new Promise(resolve=>frame.onload=resolve);checkpoint(q);frame.src='../dist/?viewport-test='+encodeURIComponent(q.id)+'&at='+Date.now();await new Promise(resolve=>frame.onload=resolve);const doc=frame.contentDocument;if(notch.checked){doc.documentElement.style.setProperty('--safe-top','44px');doc.documentElement.style.setProperty('--safe-bottom','34px')}doc.querySelector('[data-action=continue]').click();doc.querySelector('[data-action=resume]').click();await new Promise(resolve=>frame.contentWindow.requestAnimationFrame(()=>frame.contentWindow.requestAnimationFrame(resolve)));return doc}
let busy=false;
document.querySelector('#audit').onclick=async()=>{if(busy)return;busy=true;const records=[];try{for(const q of sorted){output.textContent=`Checking ${records.length+1} / ${questions.length}: ${q.id}`;const doc=await show(q),win=frame.contentWindow,body=doc.body,app=doc.querySelector('#app'),buttons=[...doc.querySelectorAll('.answer')];const record={id:q.id,questionMatches:doc.querySelector('#screen-title').textContent===q.q,width:win.innerWidth,height:win.innerHeight,compact:body.classList.contains('compact-game'),fits:body.classList.contains('game-fit'),horizontal:body.scrollWidth>body.clientWidth+1||doc.documentElement.scrollWidth>win.innerWidth+1,scrollable:getComputedStyle(body).overflowY!=='hidden',contentHeight:body.scrollHeight,viewportHeight:body.clientHeight,answers:buttons.length,minTouchHeight:Math.min(...buttons.map(b=>b.getBoundingClientRect().height)),inputFont:getComputedStyle(doc.querySelector('#app')).fontSize};if(!record.fits){body.scrollTop=body.scrollHeight;record.bottomReachable=buttons.at(-1).getBoundingClientRect().bottom<=win.innerHeight+1}record.clipped=!record.fits&&!record.scrollable;records.push(record)}const failures=records.filter(r=>!r.questionMatches||r.horizontal||r.clipped||r.answers!==4||r.minTouchHeight<44||r.bottomReachable===false);output.textContent=JSON.stringify({result:failures.length?'FAIL':'PASS',width:frame.contentWindow.innerWidth,height:frame.contentWindow.innerHeight,safeAreas:notch.checked,questions:records.length,fit:records.filter(r=>r.fits).length,compact:records.filter(r=>r.compact).length,fallback:records.filter(r=>!r.fits).map(r=>r.id),failures},null,2)}catch(e){output.textContent='FAIL: '+e.stack}finally{busy=false}};
document.querySelector('#longest').onclick=async()=>{frame.src='about:blank';await new Promise(resolve=>frame.onload=resolve);checkpoint(sorted[0]);location.href='../dist/'};
document.querySelector('#gestures').onclick=()=>{const events=[];for(const name of ['gesturestart','gesturechange','gestureend']){const e=new Event(name,{cancelable:true,bubbles:true});document.dispatchEvent(e);events.push([name,e.defaultPrevented])}for(const name of ['touchstart','touchmove']){const e=new Event(name,{cancelable:true,bubbles:true});Object.defineProperty(e,'touches',{value:[{clientX:0,clientY:0},{clientX:50,clientY:50}]});document.dispatchEvent(e);events.push([name,e.defaultPrevented])}const e=new Event('touchmove',{cancelable:true,bubbles:true});Object.defineProperty(e,'touches',{value:[{clientX:10,clientY:10}]});document.dispatchEvent(e);events.push(['single touch pan preserved',!e.defaultPrevented]);output.textContent=JSON.stringify({result:events.every(([,pass])=>pass)?'PASS':'FAIL',synthetic:true,events,touchAction:frame.contentDocument?.querySelector(".game-scene")?getComputedStyle(frame.contentDocument.documentElement).touchAction:"not measured (load gameplay first)"},null,2)};
</script></html>
