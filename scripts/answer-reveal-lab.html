<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../dist/"><title>Local answer-reveal QA</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="juice.css"><link rel="stylesheet" href="answer-reveal.css"></head><body><header><b>LOCAL REVEAL QA</b></header><main id="app"><h1>Answer-reveal fixtures</h1><p>Uses the production reveal renderer and controller. Long text is a local test fixture; the question bank is unchanged.</p><div style="display:flex;flex-wrap:wrap;gap:15px"><button class="button" id="correct">Correct reveal</button><button class="button" id="incorrect">Incorrect reveal</button><button class="button" id="long">Long Scripture explanation</button></div><p id="status" style="margin-top:25px" role="status">Ready</p><div style="height:900px" aria-hidden="true"></div><p>Background scrolling marker</p></main><script type="module">
import {AnswerReveal,answerRevealMarkup} from './answer-reveal.js';
import {questions} from './questions.js';
const reveal=new AnswerReveal(document);let count=0;
function open(correct,long=false){const q=structuredClone(questions.find(q=>q.id==='hands-conclusion'));if(long)q.explain=Array.from({length:32},(_,i)=>`Paragraph ${i+1}. ${q.explain}`).join('\n\n');document.querySelector('#app').insertAdjacentHTML('beforeend',answerRevealMarkup({q,last:{correct,earned:100,choice:0,shielded:false},streak:1}));const dialog=document.querySelector('#answer-reveal');const finish=()=>{reveal.close();dialog.remove();document.querySelector('#status').textContent=`Continued ${++count} time(s)`;document.querySelector(long?'#long':correct?'#correct':'#incorrect').focus({preventScroll:true})};dialog.querySelector('#next').onclick=finish;dialog.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();finish()}});reveal.open(dialog,finish)}
document.querySelector('#correct').onclick=()=>open(true);document.querySelector('#incorrect').onclick=()=>open(false);document.querySelector('#long').onclick=()=>open(true,true);
</script></body></html>
